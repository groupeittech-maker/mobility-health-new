# Nginx : sous-domaine API (api.srv1324425.hstgr.cloud -> port 8000)
# À placer dans /etc/nginx/sites-available/ puis activer.
# Certificat SSL : certbot --nginx -d api.srv1324425.hstgr.cloud

# HTTP (redirection vers HTTPS une fois SSL en place)
server {
    listen 80;
    listen [::]:80;
    server_name api.srv1324425.hstgr.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # WebSocket (alertes SOS temps réel)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

