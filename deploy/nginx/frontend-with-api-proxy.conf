# À intégrer dans le server block HTTPS qui sert le frontend
# (ex. server_name srv1324425.hstgr.cloud ; root /var/www/mobility-health/frontend-simple)
#
# OBLIGATOIRE pour les alertes SOS en temps réel : sans `location /ws/`, le navigateur affiche
# « WebSocket connection to 'wss://DOMAINE/ws/sos?token=…' failed » alors que /api/v1 fonctionne.
#
# Placer ces blocs AVANT `location /` (fichiers statiques), pour que /api/ et /ws/ aillent vers Uvicorn.
#
# Puis : sudo nginx -t && sudo systemctl reload nginx

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
