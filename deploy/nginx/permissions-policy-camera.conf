# Snippet à inclure dans le server block qui sert le frontend
# (product-selection.html, forms-medical.html)
# Permet l'accès à la caméra via getUserMedia (photo médicale)
#
# Ajouter dans le bloc server, par exemple :
#   include /etc/nginx/snippets/permissions-policy-camera.conf;
# Ou copier le contenu directement dans le bloc server.
#
# Référence : https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy/camera

add_header Permissions-Policy "camera=(self)" always;
add_header Feature-Policy "camera 'self'" always;
