# Éviter -Xmx8G sur une machine avec peu de RAM : swap infini = Gradle « bloqué » des minutes.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
android.useAndroidX=true
# Work around Kotlin incremental cache issues on Windows when the
# project drive differs from the Pub cache / SDK drive.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
