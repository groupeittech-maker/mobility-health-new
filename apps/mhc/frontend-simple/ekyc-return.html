<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retour à l'application - Mobility Health Care</title>
    <link rel="stylesheet" href="css/style.css?v=20261028">
    <link rel="stylesheet" href="css/admin.css?v=4">
    <style>
        .return-wrap { max-width: 560px; margin: 4rem auto; padding: 0 1rem; }
        .return-card { text-align: center; }
        .return-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        .return-actions { margin-top: 1.5rem; display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="return-wrap">
        <div class="mh-card return-card">
            <div class="return-icon">✅</div>
            <h2>Vérification terminée</h2>
            <p class="mh-muted">Retournez dans l'application MyMHC pour poursuivre votre souscription.</p>
            <div class="return-actions">
                <a class="btn btn-primary" id="openAppLink" href="mymhc://ekyc/home">Ouvrir l'application MyMHC</a>
            </div>
            <p class="mh-muted" style="margin-top:1rem;font-size:0.85rem;">Si l'application ne s'ouvre pas, revenez-y manuellement puis fermez cet onglet.</p>
        </div>
    </div>
    <script>
        (function () {
            'use strict';
            var target = document.getElementById('openAppLink').href;
            setTimeout(function () { window.location.href = target; }, 300);
        })();
    </script>
</body>
</html>
