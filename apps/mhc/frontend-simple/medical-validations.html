<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validations médicales — Mobility Health Care</title>
    <link rel="stylesheet" href="css/style.css?v=20261028">
    <link rel="stylesheet" href="css/backoffice.css?v=26">
    <style>
        .mv-page { padding: 1.2rem 1.4rem 3rem; }
        .mv-page h1 { font-size: 1.35rem; color: #1e1650; margin: 0 0 .2rem; }
        .mv-sub { color: #8a8fa3; font-size: .82rem; margin-bottom: 1rem; }
        .card { background: #fff; border: 1px solid #eceef6; border-radius: .8rem; overflow: hidden; margin-bottom: 1rem; }
        .card-h { padding: .8rem 1rem; border-bottom: 1px solid #f1f2f8; font-weight: 700; font-size: .88rem; color: #1e1650; }
        table { width: 100%; border-collapse: collapse; font-size: .8rem; }
        th { text-align: left; color: #8a8fa3; font-size: .72rem; font-weight: 600; padding: .6rem 1rem; border-bottom: 1px solid #f1f2f8; }
        td { padding: .6rem 1rem; border-bottom: 1px solid #f5f6fb; vertical-align: top; }
        .badge { font-size: .68rem; font-weight: 700; padding: .15rem .5rem; border-radius: .7rem; }
        .b-soumis { background: #fdf0dc; color: #b45309; }
        .b-validee_mc { background: #e8f0fe; color: #2d5bd7; }
        .b-esc { background: #fde8e8; color: #c81e1e; }
        .btn { border: none; border-radius: .45rem; padding: .35rem .7rem; font-size: .74rem; font-weight: 600; cursor: pointer; margin-right: .35rem; }
        .btn-ok { background: #0a9b6c; color: #fff; }
        .btn-ko { background: #fde8e8; color: #c81e1e; }
        .modal-backdrop { position: fixed; inset: 0; background: rgba(20,16,48,.45); z-index: 2500; display: none; align-items: flex-start; justify-content: center; padding: 3rem 1rem; }
        .modal-backdrop.show { display: flex; }
        .modal-card { background: #fff; border-radius: .8rem; max-width: 640px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 1.2rem 1.4rem; }
        .modal-card h2 { font-size: 1.05rem; color: #1e1650; margin: 0 0 .8rem; }
        .modal-sec { margin-bottom: .9rem; }
        .modal-sec h3 { font-size: .78rem; color: #8a8fa3; text-transform: uppercase; letter-spacing: .03em; margin: 0 0 .3rem; }
        .modal-sec p { font-size: .85rem; color: #2c2c3c; margin: 0; white-space: pre-wrap; }
        .modal-sec ul { margin: 0; padding-left: 1.1rem; font-size: .85rem; color: #2c2c3c; }
        .modal-meta { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; font-size: .76rem; color: #8a8fa3; margin-bottom: 1rem; }
        .modal-close { float: right; border: none; background: #eceef6; border-radius: .45rem; padding: .3rem .7rem; cursor: pointer; font-size: .78rem; }
        .toast { position: fixed; bottom: 1.4rem; right: 1.4rem; background: #1e1650; color: #fff; padding: .7rem 1.1rem; border-radius: .6rem; font-size: .82rem; z-index: 3000; display: none; }
        .toast.show { display: block; } .toast.error { background: #c81e1e; }
    </style>
</head>
<body data-backoffice>
    <main class="container mv-page">
        <h1>Validations médicales</h1>
        <p class="mv-sub" id="mvSub">File des éléments en attente de votre validation</p>

        <div class="card">
            <div class="card-h">Rapports médicaux (<span id="rc">0</span>)</div>
            <table>
                <thead><tr><th>#</th><th>Séjour</th><th>Type</th><th>Résumé</th><th>Statut</th><th>Actions</th></tr></thead>
                <tbody id="reportsBody"><tr><td colspan="6" style="color:#8a8fa3">Chargement…</td></tr></tbody>
            </table>
        </div>

        <div class="card">
            <div class="card-h">Documents de prise en charge (<span id="dc">0</span>)</div>
            <table>
                <thead><tr><th>#</th><th>Sinistre</th><th>Document</th><th>N°</th><th>Groupe attendu</th><th>Actions</th></tr></thead>
                <tbody id="docsBody"><tr><td colspan="6" style="color:#8a8fa3">Chargement…</td></tr></tbody>
            </table>
        </div>
    </main>
    <div class="toast" id="toast"></div>

    <div class="modal-backdrop" id="reportModal">
        <div class="modal-card">
            <button class="modal-close" onclick="document.getElementById('reportModal').classList.remove('show')">✕ Fermer</button>
            <h2 id="rmTitle">Rapport médical</h2>
            <div class="modal-meta" id="rmMeta"></div>
            <div id="rmBody"></div>
        </div>
    </div>

    <script src="js/api.js?v=20261013"></script>
    <script src="js/auth.js?v=5"></script>
    <script src="js/permissions.js?v=6"></script>
    <script src="js/backoffice-nav.js?v=25"></script>
    <script>
        const $ = id => document.getElementById(id);
        const esc = v => { const d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; };
        const toast = (m, e) => { const t = $('toast'); t.textContent = m; t.className = 'toast show' + (e ? ' error' : ''); setTimeout(() => t.className = 'toast', 3000); };
        const ROLE = localStorage.getItem('user_role') || '';
        const IS_AM = ['superviseur_affaires_medicales', 'agent_medical_mhc', 'agent_conformite_medical', 'medical_reviewer', 'admin'].includes(ROLE);

        async function load() {
            const data = await apiCall('/medical/validations/pending');
            $('mvSub').textContent = IS_AM
                ? 'Niveau 2 — validations affaires médicales + éléments escaladés (médecin-conseil indisponible)'
                : 'Niveau 1 — validations médecin-conseil';

            const reports = data.reports || [];
            lastReports = reports;
            $('rc').textContent = reports.length;
            $('reportsBody').innerHTML = reports.map(r => `
                <tr>
                    <td>${r.id}</td>
                    <td>#${r.stay_id}</td>
                    <td>${r.report_type === 'final' ? 'Rapport final' : "Rapport d'étape"}</td>
                    <td style="max-width:320px">${esc((r.resume || '').slice(0, 140))}${r.escalated ? ' <span class="badge b-esc">escaladé</span>' : ''}</td>
                    <td><span class="badge b-${r.statut}">${r.statut === 'soumis' ? 'Attente 1re val.' : 'Attente 2e val.'}</span></td>
                    <td class="table-actions">
                        <select class="action-select"><option value="">⚙️ Actions</option>
                            <option data-act="report-view" data-arg="${r.id}">👁️ Consulter</option>
                            <option data-act="report-accorde" data-arg="${r.id}">✅ Accorder</option>
                            <option data-act="report-refuse" data-arg="${r.id}">❌ Refuser</option>
                        </select>
                    </td>
                </tr>`).join('') || '<tr><td colspan="6" style="color:#8a8fa3">Aucun rapport en attente</td></tr>';

            const docs = data.care_documents || [];
            $('dc').textContent = docs.length;
            $('docsBody').innerHTML = docs.map(d => `
                <tr>
                    <td>${d.document_id}</td>
                    <td>#${d.sinistre_id}</td>
                    <td>${esc(d.document_type)}</td>
                    <td>${esc(d.numero)}</td>
                    <td>${esc(d.groupe_attendu)}</td>
                    <td class="table-actions">
                        <select class="action-select"><option value="">⚙️ Actions</option>
                            <option data-act="doc-accorde" data-arg="${d.document_id}">✅ Valider</option>
                            <option data-act="doc-refuse" data-arg="${d.document_id}">❌ Refuser</option>
                        </select>
                    </td>
                </tr>`).join('') || '<tr><td colspan="6" style="color:#8a8fa3">Aucun document en attente</td></tr>';
        }

        let lastReports = [];

        const listItems = arr => (Array.isArray(arr) && arr.length)
            ? '<ul>' + arr.map(x => '<li>' + esc(typeof x === 'object' && x !== null ? (x.libelle || x.nom || x.label || JSON.stringify(x)) : x) + '</li>').join('') + '</ul>'
            : '<p style="color:#8a8fa3">—</p>';

        function openReportModal(id) {
            const r = lastReports.find(x => String(x.id) === String(id));
            if (!r) return;
            $('rmTitle').textContent = (r.report_type === 'final' ? 'Rapport final' : "Rapport d'étape") + ' — séjour #' + r.stay_id;
            $('rmMeta').innerHTML =
                '<span>Soumis le ' + (r.created_at ? new Date(r.created_at).toLocaleString('fr-FR') : '—') + '</span>' +
                '<span>Statut : ' + esc(r.statut) + '</span>' +
                (r.escalated ? '<span style="color:#c81e1e">Escaladé</span>' : '');
            $('rmBody').innerHTML =
                '<div class="modal-sec"><h3>Résumé</h3><p>' + esc(r.resume || '—') + '</p></div>' +
                '<div class="modal-sec"><h3>Actes effectués</h3>' + listItems(r.actes) + '</div>' +
                '<div class="modal-sec"><h3>Examens effectués</h3>' + listItems(r.examens) + '</div>' +
                (r.evolution ? '<div class="modal-sec"><h3>Évolution</h3><p>' + esc(r.evolution) + '</p></div>' : '') +
                (r.observations ? '<div class="modal-sec"><h3>Observations</h3><p>' + esc(r.observations) + '</p></div>' : '') +
                (r.refusal_reason ? '<div class="modal-sec"><h3>Motif du refus</h3><p style="color:#c81e1e">' + esc(r.refusal_reason) + '</p></div>' : '');
            $('reportModal').classList.add('show');
        }

        window.mhRowAction = async (act, id) => {
            if (act === 'report-view') { openReportModal(id); return; }
            try {
                if (act === 'report-accorde' || act === 'report-refuse') {
                    const decision = act === 'report-accorde' ? 'accorde' : 'refuse';
                    const commentaire = decision === 'refuse' ? prompt('Motif du refus :') : null;
                    await apiCall(`/medical/medical-reports/${id}/validate`, { method: 'POST', body: JSON.stringify({ decision, commentaire }) });
                } else {
                    await apiCall(`/mhc/care-documents/${id}/validation`, { method: 'POST', body: JSON.stringify({ approve: act === 'doc-accorde' }) });
                }
                toast('Validation enregistrée'); load();
            } catch (e) { toast(e.message || 'Erreur', true); }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            if (!(await requireBackoffice('index.html'))) return;
            $('reportModal').addEventListener('click', e => {
                if (e.target === $('reportModal')) $('reportModal').classList.remove('show');
            });
            load();
        });
    </script>
</body>
</html>
