<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Mobility Health Care</title>
    <link rel="stylesheet" href="css/style.css?v=20261027">
    <style>
        #registrationSuccess {
            background-color: rgba(21, 164, 108, 0.1);
            border: 1px solid rgba(21, 164, 108, 0.4);
            color: var(--success-color);
        }
        .slogan {
            margin-top: 0.5rem;
            color: var(--secondary-color);
            font-size: 1.1rem;
            font-weight: 500;
            font-style: italic;
            letter-spacing: 0.5px;
            text-align: center;
        }
        /* Styles pour mobile */
        @media (max-width: 768px) {
            .auth-logo img {
                max-height: 100px !important;
                width: auto !important;
            }
            .auth-card {
                padding: 1.5rem;
            }
        }
        @media (max-width: 480px) {
            .auth-logo img {
                max-height: 80px !important;
            }
            .auth-card {
                padding: 1rem;
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
    <main class="auth-shell">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="assets/logo_mobility_healthcare_officiel.png?v=3" alt="Mobility HealthCare" class="brand-logo" style="max-width: 100%; height: auto; object-fit: contain;">
                <p class="slogan">Travel safe, Live free.</p>
            </div>
            <h2>Connexion</h2>
            
            <!-- Message de confirmation d'inscription -->
            <div id="registrationSuccess" class="alert alert-success" style="display: none; margin-bottom: 1rem;">
                <strong>Inscription réussie !</strong> Vous pouvez maintenant vous connecter.
            </div>
            
            <form id="loginForm" method="POST" action="#" onsubmit="return false;">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur ou e-mail</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" required autocomplete="current-password" style="padding-right: 45px;">
                        <button type="button" id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 5px; color: #64748b; display: inline-flex; align-items: center;" title="Afficher/Masquer le mot de passe">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div style="text-align: right; margin-top: 0.5rem;">
                        <a href="#" id="forgotPasswordLink" style="color: var(--primary-color); text-decoration: none; font-size: 0.875rem;">Mot de passe oublié ?</a>
                    </div>
                </div>

                <div class="form-actions" style="border-top:none;padding-top:0;">
                    <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%;">Se connecter</button>
                </div>
            </form>
            <div style="display:flex;align-items:center;gap:0.75rem;background:#F3EEF9;border-radius:12px;padding:0.75rem 1rem;margin-top:1.25rem;">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4E267C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
                <div>
                    <div style="font-size:0.85rem;font-weight:600;color:#4E267C;">Vos données sont protégées</div>
                    <div style="font-size:0.75rem;color:#666;line-height:1.4;">Nous utilisons un chiffrement de niveau bancaire pour sécuriser vos informations.</div>
                </div>
            </div>
            <div class="auth-links">
                <p>Pas encore de compte ? <a href="register.html" style="color: var(--primary-color); text-decoration: none;">S'inscrire</a></p>
                <p style="margin-top: 0.5rem;"></p>
            </div>
            <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px dashed rgba(79, 31, 120, 0.25);">
                <a href="https://mobilityhealth-care.com/" target="_blank" rel="noopener noreferrer" style="color: var(--muted-text); text-decoration: none; font-size: 0.875rem;">https://mobilityhealth-care.com/</a>
            </div>
        </div>
    </main>

    <script>
        window.MH_EYE_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        window.MH_EYE_OFF_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    </script>
    <script src="js/api.js?v=20261013"></script>
    <script src="js/login.js?v=3"></script>
</body>
</html>
