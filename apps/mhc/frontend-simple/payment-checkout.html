<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle souscription - Mobility Health</title>
    <script>
        (function () {
            var keep = [];
            var params = new URLSearchParams(window.location.search);
            var out = new URLSearchParams();
            keep.forEach(function (k) { if (params.get(k)) out.set(k, params.get(k)); });
            var target = 'subscription-wizard.html' + (out.toString() ? '?' + out.toString() : '');
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Redirection vers la nouvelle souscription… <a id="fallback" href="subscription-wizard.html">Cliquez ici</a>.</p>
    <script>document.getElementById('fallback').href = 'subscription-wizard.html' + (window.location.search.includes('subscription_id') ? window.location.search : '');</script>
</body>
</html>
