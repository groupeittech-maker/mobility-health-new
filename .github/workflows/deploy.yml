# Déploiement VPS Hostinger — uniquement après CI vert sur main (ou manuel).
name: Deploy to Hostinger VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI Pipeline]
    types: [completed]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-production-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Recommandé si le firewall Hostinger bloque le port 22 aux runners GitHub cloud.
  # Voir deploy/README-GITHUB-RUNNER.md + variable USE_SELF_HOSTED_DEPLOY=true
  deploy-self-hosted:
    name: Déploiement (runner VPS)
    runs-on: [self-hosted, mhc-vps]
    if: >
      vars.USE_SELF_HOSTED_DEPLOY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Infos déploiement
        run: |
          echo "## Déploiement Mobility Health (self-hosted)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner : self-hosted sur VPS (pas de SSH entrant)" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy on VPS
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: "noreply@mobility-healthcare.cloud"
          SMTP_FROM_EMAIL: "noreply@mobility-healthcare.cloud"
          ASSURANCE_EMAIL: "noreply@mobility-healthcare.cloud"
        run: bash .github/scripts/vps-local-deploy.sh

      - name: Mise à jour locale (instructions)
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ✅ Déploiement terminé" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit déployé : \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-ssh:
    name: Déploiement (SSH cloud)
    runs-on: ubuntu-latest
    if: >
      vars.USE_SELF_HOSTED_DEPLOY != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Infos déploiement
        run: |
          echo "## Déploiement Mobility Health (SSH)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branche : main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Déclencheur : ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare SSH and test connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_CONNECT_ATTEMPTS: "8"
          SSH_CONNECT_WAIT: "20"
        run: bash .github/scripts/gh-ssh-setup.sh

      - name: Deploy via SSH
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: bash .github/scripts/deploy-via-ssh.sh

      - name: Mise à jour locale (instructions)
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ✅ Déploiement terminé" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit déployé : \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # 2e tentative : le firewall Hostinger bloque parfois certaines IP GitHub Actions.
  deploy-ssh-retry:
    name: Déploiement (SSH cloud, 2e tentative)
    needs: deploy-ssh
    runs-on: ubuntu-latest
    if: >
      vars.USE_SELF_HOSTED_DEPLOY != 'true' &&
      needs.deploy-ssh.result == 'failure' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Attente avant nouvelle IP runner
        run: |
          echo "Première tentative SSH échouée — pause 8 min puis nouvel essai (IP runner différente)."
          sleep 480

      - name: Prepare SSH and test connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_CONNECT_ATTEMPTS: "10"
          SSH_CONNECT_WAIT: "25"
        run: bash .github/scripts/gh-ssh-setup.sh

      - name: Deploy via SSH
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: bash .github/scripts/deploy-via-ssh.sh

      - name: Résumé
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "### ✅ Déploiement terminé (2e tentative SSH)" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit déployé : \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
