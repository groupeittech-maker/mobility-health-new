# Déploiement VPS Hostinger — uniquement après CI vert sur main (ou manuel).
name: Deploy to Hostinger VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI Pipeline]
    types: [completed]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Infos déploiement
        run: |
          echo "## Déploiement Mobility Health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branche : main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Déclencheur : ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier secrets et réseau (IPv4)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name non configuré (Settings → Secrets → Actions)"
              exit 1
            fi
          done
          HOST="$(echo "$SSH_HOST" | tr -d '[:space:]')"
          if [[ "$HOST" == *@* ]]; then
            echo "::error::SSH_HOST doit être un hostname ou une IP seule (ex. srv1324425.hstgr.cloud), sans user@"
            exit 1
          fi
          echo "Cible : ${SSH_USER}@${HOST} (IPv4 forcé)"
          echo "Résolution A :"
          getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u || dig +short A "$HOST" || true
          echo "Test TCP :22 (8s) :"
          if timeout 8 bash -c "exec 3<>/dev/tcp/${HOST}/22" 2>/dev/null; then
            exec 3<&- 3>&-
            echo "✅ Port 22 joignable en IPv4 depuis le runner GitHub"
          else
            echo "::warning::Port 22 injoignable depuis GitHub Actions."
            echo "Vérifiez : VPS démarré, firewall Hostinger (autoriser plages IP GitHub Actions), SSH_HOST = hostname ou IP publique."
            echo "Doc : docs/CICD-AUTOMATION.md § Deploy SSH"
          fi

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          HOST="$(echo "$SSH_HOST" | tr -d '[:space:]')"
          python3 << 'PY'
          import os, sys
          raw = os.environ.get("SSH_PRIVATE_KEY") or ""
          if not raw.strip():
              print("::error::Le secret SSH_PRIVATE_KEY est vide.")
              sys.exit(1)
          key = raw.replace("\r\n", "\n").replace("\r", "\n")
          if "BEGIN" in key and "\\n" in key:
              key = key.replace("\\n", "\n")
          key = key.strip() + "\n"
          if "BEGIN OPENSSH PRIVATE KEY" not in key and "BEGIN RSA PRIVATE KEY" not in key:
              print("::error::SSH_PRIVATE_KEY n'est pas une clé privée (fichier sans .pub).")
              sys.exit(1)
          path = os.path.expanduser("~/.ssh/id_ed25519")
          with open(path, "w", newline="\n") as f:
              f.write(key)
          os.chmod(path, 0o600)
          print("Clé SSH installée dans ~/.ssh/id_ed25519")
          PY
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -4 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts || true
          {
            echo "Host mhc-vps"
            echo "  HostName ${HOST}"
            echo "  User ${SSH_USER}"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  AddressFamily inet"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ConnectTimeout 20"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh -4 mhc-vps "echo OK; hostname; date"

      - name: Create frontend archive
        run: |
          tar czf frontend.tar.gz -C apps/mhc/frontend-simple .
          test -s frontend.tar.gz

      - name: Copy frontend archive to server
        run: |
          scp -4 frontend.tar.gz mhc-vps:/tmp/frontend.tar.gz

      - name: Create backend archives
        run: |
          tar czf app.tar.gz --exclude="__pycache__" --exclude="*.pyc" --exclude="*.pyo" --exclude=".git" -C apps/mhc app/
          tar czf alembic.tar.gz --exclude="__pycache__" --exclude="*.pyc" --exclude=".git" -C apps/mhc alembic/
          cp apps/mhc/docker-compose.yml .
          cp apps/mhc/docker-compose.prod.yml .
          cp apps/mhc/Dockerfile .
          cp apps/mhc/Dockerfile.prod .
          cp apps/mhc/requirements.txt .
          cp apps/mhc/alembic.ini .

      - name: Copy backend archives to server
        run: |
          scp -4 app.tar.gz alembic.tar.gz docker-compose.yml docker-compose.prod.yml \
            Dockerfile Dockerfile.prod requirements.txt alembic.ini \
            mhc-vps:/tmp/

      - name: Extract and deploy frontend
        run: |
          ssh -4 mhc-vps "bash -s" < .github/scripts/remote-deploy-frontend.sh

      - name: Deploy backend and restart services
        run: |
          ssh -4 mhc-vps "bash -s" < .github/scripts/remote-deploy-backend.sh

      - name: Mise à jour locale (instructions)
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ✅ Déploiement terminé" >> "$GITHUB_STEP_SUMMARY"
          echo "Mettez à jour votre dépôt local :" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "./scripts/sync-local-from-main.sh" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '```powershell' >> "$GITHUB_STEP_SUMMARY"
          echo ".\scripts\sync-local-from-main.ps1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit déployé : \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
